server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # PDFs up to 25 MB (DocumentService.MaxFileSizeBytes); nginx's default limit is 1 MB.
    client_max_body_size 26m;

    # Docker's internal DNS. Resolving "api" on each request (through the variable below), not
    # once at startup, keeps nginx working after the api container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream http://api:8080;
        # Strip the prefix: /api/notebooks reaches the API as /notebooks.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        # llama3.1 on CPU can take longer than nginx's default 60 s to answer.
        proxy_read_timeout 300s;
    }

    # Angular routes such as /notebooks/{id} have no file on disk: serve index.html and let the
    # router take over, so reloading any page shows the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
