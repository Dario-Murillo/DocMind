<header>
  <h1>{{ title() }}</h1>
  <p class="hint">Local, self-hosted RAG document Q&amp;A.</p>

  @if (auth.currentUser(); as user) {
    <div class="session">
      <span>{{ user.email }}</span>
      <button matButton type="button" (click)="logout()">Log out</button>
    </div>
  }
</header>

<main>
  <router-outlet />
</main>
